[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-checker"
version = "0.1.0"
description = "Check and fix LaTeX syntax issues in Markdown and Jupyter notebooks"
readme = "README.md"
authors = [
    {name = "Max Ghenis", email = "max@policyengine.org"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "nbformat>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
]

[project.scripts]
latex-checker = "latex_checker.cli:main"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
